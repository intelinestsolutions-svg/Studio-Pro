name: Deploy to Hostinger

# Push to main and the built site goes live. The upload runs file-by-file
# through scripts/deploy.mjs, which replaces exactly what `pnpm build`
# produced — the ai/, test/ and apps/ folders that live in the same document
# root (they back the subdomains) are never touched.

on:
  push:
    branches: [main]
  workflow_dispatch:

# never let a second deploy interleave with one already in flight
concurrency:
  group: deploy-prostudio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload to Hostinger
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: node scripts/deploy.mjs

      - name: Verify live
        run: |
          set -e
          code=$(curl -s -o /dev/null -w '%{http_code}' https://prostudio.my/)
          echo "homepage: $code"
          test "$code" = "200"

          js=$(ls dist/assets | grep '\.js$')
          echo "bundle: $js"
          curl -sf -o /dev/null "https://prostudio.my/assets/$js"

          for p in about services contact; do
            out=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "https://prostudio.my/$p")
            echo "/$p -> $out"
            test "${out%% *}" = "301"
          done
